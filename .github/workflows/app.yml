name: app

on:
  push:
    branches: ['**']
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch: # botão "Run workflow" (ex.: depois de mudar API_BASE_URL)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get
      # TODO: reativar a checagem de formatação depois do primeiro
      # `dart format lib test` local (o código inicial não foi formatado
      # pelo SDK). Linha: dart format --output=none --set-exit-if-changed lib test
      - name: analyze
        run: flutter analyze
      - name: test
        run: flutter test

  apk:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Enquanto android/ não estiver commitado, gera e ajusta aqui.
      - name: preparar android/
        run: |
          set -o pipefail
          ./tool/setup_android.sh 2>&1 | tee -a /tmp/build.log
      # Assinatura própria (necessária para a Play Store e para instalar
      # atualizações por cima). Vem dos segredos ANDROID_*; sem eles, usa a
      # chave de debug do CI (cada build exige desinstalar o anterior).
      - name: chave de assinatura (se configurada)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/upload-keystore.jks
            printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KS_PASS" "$KEY_ALIAS" "$KS_PASS" > android/key.properties
            echo "SIGNED=1" >> "$GITHUB_ENV"
          fi
      - name: build APK (release, arm64)
        # URL da API embutida no APK. Defina a variável de repositório
        # API_BASE_URL (Settings → Secrets and variables → Actions → Variables)
        # para trocar; sem ela, usa a API no Render.
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://humannet-api.onrender.com' }}
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GIT_SHA="${GITHUB_SHA::7}" 2>&1 | tee -a /tmp/build.log
      - name: build AAB (Play Store)
        if: env.SIGNED == '1'
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://humannet-api.onrender.com' }}
        run: |
          set -o pipefail
          flutter build appbundle --release \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GIT_SHA="${GITHUB_SHA::7}" 2>&1 | tee -a /tmp/build.log
      # Repositório público: o resumo do job é visível sem login, então o fim
      # do log de build vai para lá quando algo falha.
      - name: resumo do erro de build
        if: failure()
        run: |
          {
            echo '### Falha no build do app (últimas 80 linhas)'
            echo '```'
            tail -n 80 /tmp/build.log 2>/dev/null || echo '(sem log)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: humannet-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: env.SIGNED == '1'
        with:
          name: humannet-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # Publica o APK da main como pré-release fixa "dev-latest", para baixar
  # direto no celular (link estável, sem login, sem zip).
  release:
    needs: apk
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: humannet-apk
      # `--clobber` substitui o APK antigo (o mesmo nome era mantido antes).
      - name: publicar APK na release dev-latest
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv app-release.apk humannet-dev.apk
          if ! gh release view dev-latest >/dev/null 2>&1; then
            gh release create dev-latest --prerelease --title "HumanNet (dev)" \
              --notes "Build de desenvolvimento da main. Baixe humannet-dev.apk e instale."
          fi
          gh release upload dev-latest humannet-dev.apk --clobber
          gh release edit dev-latest --notes "Build de desenvolvimento da main, commit ${GITHUB_SHA::7}. Baixe humannet-dev.apk e instale."
