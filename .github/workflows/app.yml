name: app

on:
  push:
    branches: ['**']
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch: # botão "Run workflow" (ex.: depois de mudar API_BASE_URL)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get
      # TODO: reativar a checagem de formatação depois do primeiro
      # `dart format lib test` local (o código inicial não foi formatado
      # pelo SDK). Linha: dart format --output=none --set-exit-if-changed lib test
      # Logs exigem login; erros viram anotações públicas.
      - name: analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee /tmp/analyze.log || {
            grep -E "(error|warning|info) •" /tmp/analyze.log | head -n 20 | while IFS= read -r line; do
              echo "::error title=analyze::${line:0:400}"
            done
            exit 1
          }
      - name: test
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee /tmp/test.log || {
            grep -E -A1 "\[E\]|Expected:|Actual:|Which:|The following|was:|Error:|Exception:|Bad state|test/[a-z_]+\.dart [0-9]+:[0-9]+|test/[a-z_]+\.dart:[0-9]+" /tmp/test.log \
              | grep -v "^--$" | head -n 40 | while IFS= read -r line; do
              echo "::error title=teste::${line:0:400}"
            done
            exit 1
          }

  apk:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Enquanto android/ não estiver commitado, gera e ajusta aqui.
      - name: preparar android/
        run: |
          set -o pipefail
          ./tool/setup_android.sh 2>&1 | tee -a /tmp/build.log
      # Assinatura própria (necessária para a Play Store e para instalar
      # atualizações por cima). Vem dos segredos ANDROID_*; sem eles, usa a
      # chave de debug do CI (cada build exige desinstalar o anterior).
      - name: chave de assinatura (se configurada)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            # Tolera espaços/quebras de linha coladas junto no segredo.
            printf '%s' "$KS_B64" | tr -d ' \r\n\t' | base64 -d > android/app/upload-keystore.jks
            KS_PASS=$(printf '%s' "$KS_PASS" | tr -d '\r\n')
            KEY_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d ' \r\n')
            # Confere chave + senha + alias antes do build (erro claro e público).
            if ! keytool -list -keystore android/app/upload-keystore.jks \
                 -storepass "$KS_PASS" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              echo "::error title=assinatura::Segredos ANDROID_* não conferem (chave, senha ou alias errados)."
              exit 1
            fi
            printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KS_PASS" "$KEY_ALIAS" "$KS_PASS" > android/key.properties
            echo "SIGNED=1" >> "$GITHUB_ENV"
            echo "::notice title=assinatura::APK/AAB assinados com a chave de upload."
          else
            echo "::warning title=assinatura::Sem segredos ANDROID_*: build com chave de debug, sem AAB."
          fi
      # Push (Firebase): o google-services.json vem do segredo
      # GOOGLE_SERVICES_JSON (conteúdo inteiro do arquivo). Sem ele, o app sai
      # sem push (as bolinhas continuam atualizando a cada minuto).
      - name: firebase (se configurado)
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS_JSON" ]; then
            python3 tool/firebase_values.py
            echo "PUSH=true" >> "$GITHUB_ENV"
            echo "::notice title=push::Notificações push ligadas."
          else
            echo "PUSH=false" >> "$GITHUB_ENV"
            echo "::warning title=push::Sem segredo GOOGLE_SERVICES_JSON: build sem push."
          fi
      - name: build APK (release, arm64)
        # URL da API embutida no APK. Defina a variável de repositório
        # API_BASE_URL (Settings → Secrets and variables → Actions → Variables)
        # para trocar; sem ela, usa a API no Render.
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://humannet-api.onrender.com' }}
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GIT_SHA="${GITHUB_SHA::7}" \
            --dart-define=PUSH="$PUSH" 2>&1 | tee -a /tmp/build.log
      - name: build AAB (Play Store)
        if: env.SIGNED == '1'
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://humannet-api.onrender.com' }}
        run: |
          set -o pipefail
          flutter build appbundle --release \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GIT_SHA="${GITHUB_SHA::7}" \
            --dart-define=PUSH="$PUSH" 2>&1 | tee -a /tmp/build.log
      # Repositório público: anotações de erro são visíveis sem login, então o
      # trecho relevante do log de build vira uma anotação quando algo falha.
      - name: resumo do erro de build
        if: failure()
        run: |
          {
            echo '### Falha no build do app (últimas 80 linhas)'
            echo '```'
            tail -n 80 /tmp/build.log 2>/dev/null || echo '(sem log)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -iE "error|exception|what went wrong|failed|unresolved" /tmp/build.log 2>/dev/null \
            | tail -n 12 | while IFS= read -r line; do
              echo "::error title=build::${line:0:400}"
            done
          tail -n 25 /tmp/build.log 2>/dev/null \
            | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print substr($0,1,200)}' \
            | sed -e 's/^/::warning title=fim do log::/'
          echo
      - uses: actions/upload-artifact@v7
        with:
          name: humannet-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: env.SIGNED == '1'
        with:
          name: humannet-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # Versão web (PWA para iPhone): compila em toda branch; publica no GitHub
  # Pages só a partir da main. Endereço: https://guimvmatos.github.io/humannet/
  web:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: build web
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://humannet-api.onrender.com' }}
        run: |
          set -o pipefail
          flutter build web --release --base-href /humannet/ \
            --no-web-resources-cdn \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GIT_SHA="${GITHUB_SHA::7}" \
            --dart-define=PUSH=false 2>&1 | tee /tmp/web.log || {
            grep -iE "error|exception|failed" /tmp/web.log | tail -n 15 | while IFS= read -r line; do
              echo "::error title=web::${line:0:400}"
            done
            exit 1
          }
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: app/build/web

  # Precisa de Settings → Pages → Source: "GitHub Actions" (uma vez).
  pages:
    needs: web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Publica o APK da main como pré-release fixa "dev-latest", para baixar
  # direto no celular (link estável, sem login, sem zip).
  release:
    needs: apk
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: humannet-apk
      # `--clobber` substitui o APK antigo (o mesmo nome era mantido antes).
      - name: publicar APK na release dev-latest
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv app-release.apk humannet-dev.apk
          if ! gh release view dev-latest >/dev/null 2>&1; then
            gh release create dev-latest --prerelease --title "HumanNet (dev)" \
              --notes "Build de desenvolvimento da main. Baixe humannet-dev.apk e instale."
          fi
          gh release upload dev-latest humannet-dev.apk --clobber
          gh release edit dev-latest --notes "Build de desenvolvimento da main, commit ${GITHUB_SHA::7}. Baixe humannet-dev.apk e instale."
