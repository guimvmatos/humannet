# Blueprint do Render (https://render.com/docs/blueprint-spec).
# Ambiente de TESTE: planos gratuitos. O serviço "dorme" sem uso (a primeira
# requisição depois disso demora ~1 min). Para uso com amigos: plan: starter.
services:
  - type: web
    name: humannet-api
    runtime: docker
    plan: free
    region: virginia
    branch: main
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    # Só recompila/reinicia quando o código do servidor muda (não em docs/app).
    buildFilter:
      paths:
        - backend/**
    envVars:
      # Banco no Neon (gratuito e permanente). O valor é colado no painel do
      # Render; ver docs/SETUP-BETA.md. `sync: false` impede o Blueprint de
      # sobrescrevê-lo.
      - key: DATABASE_URL
        sync: false
      # Código do primeiro convite (16+ caracteres). O Render pede o valor
      # na criação. Só vale enquanto o banco não tem nenhum usuário.
      - key: BOOTSTRAP_INVITE_CODE
        sync: false
      # Administradores (moderação), separados por vírgula.
      - key: ADMIN_USERNAMES
        value: guimvmatos
      - key: LOG_FORMAT
        value: json
      - key: RUST_LOG
        value: humannet_api=info,tower_http=info
